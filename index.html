<style>
/* Layout: one-screen arcade cabinet. Canvas letterboxed, thumb controls pinned to the bottom corners. Single dark look by choice. */
:root{
  --void:#05080d;
  --ink:#e6f2ee;
  --moss:#37e0c8;
  --lamp:#ffb547;
  --bloom:#ff4f8b;
  --slate:#5b7480;
  --glass:rgba(16,28,36,.55);
  --rim:rgba(55,224,200,.35);
  --pix:'Silkscreen',ui-monospace,Menlo,monospace;
  --ui:'Chakra Petch',system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink);overflow:hidden;overscroll-behavior:none}
body{font-family:var(--ui);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#wrap{position:relative;height:100%;display:flex;align-items:center;justify-content:center;touch-action:none}
#wrap.portrait{align-items:flex-start;padding-top:12px;box-sizing:border-box}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;background:#0a0c22;border-radius:6px;box-shadow:0 0 0 1px rgba(55,224,200,.12),0 20px 60px rgba(0,0,0,.6)}

/* touch controls */
.ctl{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:0 16px calc(16px + env(safe-area-inset-bottom,0px));pointer-events:none}
.ctl[hidden]{display:none!important}
#dpad{pointer-events:auto;width:150px;height:76px;border-radius:38px;background:var(--glass);border:1.5px solid var(--rim);display:flex;align-items:center;justify-content:space-between;padding:0 18px;box-sizing:border-box;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);touch-action:none}
#dpad svg{width:26px;height:26px;fill:var(--ink);opacity:.55;transition:opacity .08s,transform .08s}
#dpad svg.on{opacity:1;fill:var(--moss);transform:scale(1.15)}
.acts{display:grid;grid-template-columns:repeat(2,auto);grid-template-areas:". dash" "fire jump";gap:10px;pointer-events:auto}
.btn{touch-action:none;border-radius:50%;border:1.5px solid var(--rim);background:var(--glass);color:var(--ink);font-family:var(--pix);font-size:11px;letter-spacing:.06em;display:grid;place-items:center;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);cursor:pointer;padding:0}
.btn.on{background:rgba(55,224,200,.3);border-color:var(--moss);transform:scale(.94)}
#bJ{grid-area:jump;width:74px;height:74px}
#bF{grid-area:fire;width:74px;height:74px;border-color:rgba(255,181,71,.5)}
#bF.on{background:rgba(255,181,71,.3);border-color:var(--lamp)}
#bD{grid-area:dash;width:54px;height:54px;justify-self:center}

.ctl.shmup #dpad,.ctl.shmup #bJ,.ctl.shmup #bD{visibility:hidden}
#arw{position:absolute;inset:0;z-index:2;background:#05030a;touch-action:none}
#arw[hidden]{display:none!important}
#arv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#arc{position:absolute;inset:0;width:100%;height:100%;border-radius:0;box-shadow:none;background:transparent;image-rendering:auto}
#arFire{position:absolute;right:calc(18px + env(safe-area-inset-right,0px));bottom:calc(18px + env(safe-area-inset-bottom,0px));width:86px;height:86px;border-color:rgba(255,122,217,.6);font-size:13px}
#arMode{position:absolute;left:calc(14px + env(safe-area-inset-left,0px));top:calc(54px + env(safe-area-inset-top,0px));font-size:12px;padding:6px 12px;background:rgba(5,3,10,.55)}
#arFire.on{background:rgba(255,122,217,.3);border-color:#ff7ad9}
#pauseBtn{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:16px;width:38px;height:38px;border-radius:10px;border:1px solid var(--rim);background:var(--glass);color:var(--ink);display:grid;place-items:center;cursor:pointer;z-index:3}
#pauseBtn svg{width:16px;height:16px;fill:currentColor}

/* overlay panels */
#ov{position:absolute;inset:0;display:grid;place-items:center;padding-inline:16px;background:radial-gradient(ellipse at 50% 40%,rgba(10,16,30,.55),rgba(3,5,9,.88));z-index:4}
#ov[hidden]{display:none!important}
.panel{max-width:440px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px}
.eyebrow{font-family:var(--pix);font-size:11px;letter-spacing:.3em;color:var(--moss);text-transform:uppercase}
h1{margin:0;font-family:var(--pix);font-weight:700;font-size:clamp(34px,9vw,58px);line-height:.95;letter-spacing:.02em;text-wrap:balance;color:var(--ink);text-shadow:0 0 18px rgba(55,224,200,.45),3px 3px 0 #0e3a40}
h1 .em{color:var(--lamp);text-shadow:0 0 18px rgba(255,181,71,.5),3px 3px 0 #4a2a06}
.sub{margin:0;font-size:15px;line-height:1.5;color:#b7cbc6;max-width:34ch}
.stats{display:flex;gap:22px;font-family:var(--pix);font-size:12px;color:#b7cbc6;font-variant-numeric:tabular-nums}
.stats b{display:block;font-size:20px;color:var(--ink)}
.go{font-family:var(--pix);font-size:15px;letter-spacing:.12em;color:#06100f;background:var(--moss);border:0;border-radius:999px;padding:14px 34px;cursor:pointer;box-shadow:0 0 0 4px rgba(55,224,200,.18),0 8px 24px rgba(55,224,200,.25)}
.go:focus-visible,.ghost:focus-visible,.btn:focus-visible,#pauseBtn:focus-visible{outline:2px solid var(--lamp);outline-offset:3px}
.ghost{font-family:var(--ui);font-size:14px;color:#b7cbc6;background:transparent;border:1px solid rgba(183,203,198,.3);border-radius:999px;padding:8px 18px;cursor:pointer}
.keys{font-size:12px;color:var(--slate);line-height:1.6}
.keys kbd{font-family:var(--pix);font-size:10px;border:1px solid #2c3e46;border-radius:4px;padding:1px 5px;color:#9fb5b0}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.row .ghost{padding:6px 12px;font-size:13px}
@media (max-height:440px){h1{font-size:clamp(30px,8vh,44px)}.sub{font-size:13px;line-height:1.4}.panel{gap:9px}.go{padding:11px 30px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

  <button class="go" id="go">RESUME</button><div class="row"><button class="ghost" id="snd">Sound: ${muted ? 'off' : 'on'}</button><button class="ghost" id="quit">Quit to title</button></div>`);
  document.getElementById('go').onclick = resume;
  document.getElementById('snd').onclick = e => { muted = !muted; e.target.textContent = 'Sound: ' + (muted ? 'off' : 'on'); };

}
function resume() { S.mode = 'play'; hideOv(); last = performance.now(); }
pauseBtn.onclick = () => S.mode === 'play' && pause();
function endScreen(won) {
  S.mode = 'over'; cv.style.cursor = ''; arClose();
  const t = S.t, mm = Math.floor(t / 60), ss = Math.floor(t % 60).toString().padStart(2, '0');
  let score = S.score;
  if (won) { ease = .85; score += Math.max(0, Math.round(3000 - (S.t - S.t0) * 20)) + P.hp * 20; }
  const nb = score > best; if (nb) { best = score; try { localStorage.setItem('vd-best', best); } catch (e) {} }
  const last = LV === 6;
  if (won && !last) { try { localStorage.setItem('vd-l' + (LV + 1), '1'); } catch (e) {} }
  const WIN = { 1: ['Nest cleared · Level 1 complete', 'Ember Moth<br><span class="em">down</span>'], 2: ['You cut your way out · Level 2 complete', 'Hollow Bloom<br><span class="em">burst</span>'], 3: ['Frostline cleared · Level 3 complete', 'Frost Grub<br><span class="em">shattered</span>'], 4: ['Sunscar Mesa cleared · Level 4 complete', 'Burrow Queen<br><span class="em">down</span>'], 5: ['Void Reach cleared · Level 5 complete', 'Hive Leviathan<br><span class="em">destroyed</span>'], 6: ['Mirror Halls cleared · All 6 levels done', 'The Face<br><span class="em">shattered</span>'] }[LV];
  const eyebrow = won ? WIN[0] : 'Suit integrity lost';
  const title = won ? WIN[1] : 'Wren<br><span class="em">recalled</span>';
  const goTxt = won ? (last ? 'PLAY FROM LEVEL 1' : 'ON TO LEVEL ' + (LV + 1)) : save ? (LV === 5 ? (save.gut ? 'RETRY INSIDE THE LEVIATHAN' : save.stage === 'boss' ? 'RETRY THE LEVIATHAN' : 'RESPAWN AT CHECKPOINT') : save.boss ? 'RETRY THE GRUB FIGHT' : save.gut ? (LV === 6 ? 'FACE IT AGAIN' : LV === 4 ? 'RETRY THE BURROW' : 'RETRY INSIDE THE BLOOM') : 'RESPAWN AT BEACON') : 'RETRY';

function respawn() {

  S.mode = 'play'; S.beacon = 1; S.score = sv.score; S.t = sv.t; S.t0 = sv.t0 || 0;
  if (sv.lv === 5) { enterShmup(sv); hideOv(); return; }
  if (sv.boss) {
    S.locked = true; P.x = ARENA + 16; P.y = GY - 14; cam = ARENA; enemies = []; hideOv(); spawnCat(sv.boss);

/* ---------- helpers ---------- */
function burst(x, y, n, cols, sp = 80, life = .5, g = 120) {
  for (let i = 0; i < n; i++) { const a = Math.random() * 6.283, v = sp * (.3 + Math.random()); parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: life * (.5 + Math.random()), max: life, c: cols[i % cols.length], g, s: Math.random() > .7 ? 2 : 1 }); }
}
function hurt(d, fromX) {

  P.hp -= d; P.inv = 1.1; P.vy = -150; P.vx = (P.x < fromX ? -1 : 1) * 120; shake = 5; sfx.hit();
  burst(P.x + 5, P.y + 7, 10, ['#dfe9ee', '#37e0c8'], 90);
  if (P.hp <= 0) { P.hp = 0; ease = Math.max(.6, ease - .15); burst(P.x + 5, P.y + 7, 40, ['#dfe9ee', '#37e0c8', '#ffb547'], 140, 1); setTimeout(() => endScreen(false), 900); S.mode = 'dying'; }

const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
function spawnBoss() {

  if (LV === 4) { B = { kind: 'ant', x: WORLD + 40, y: GY, hp: 45, max: 45, st: 'intro', t: 0, ph: 0, dig: 0, flash: 0 }; sfx.roar(); shake = 8; return; }
  if (LV === 3) { spawnCat(); save = { lv: 3, boss: catSnap(), score: S.score, t: S.t, t0: S.t0 }; sfx.roar(); shake = 8; return; }

  sfx.roar(); shake = 8;
}

/* ---------- update ---------- */
function update(dt) {
  S.t += S.mode === 'play' ? dt : 0;
  if (S.mode === 'play') S.alive += dt;
  const D = diff();
  if (S.banner > 0) S.banner -= dt;
  if (S.anom > 0) S.anom -= dt;
  const live = S.mode === 'play';
  if (S.gut && G) { updateGut(dt, D, live); return; }
  if (S.shmup && SH) { updateShmup(dt, D, live); return; }

  // ship cinematics
  if (S.cine && live) updateCine(dt);
  if (S.extT > 0 && live) { S.extT -= dt; if (S.extT <= 0) startExtract(); }
  if (P.frozen > 0) P.frozen -= dt;
  const ctrl = !S.lock && !(P.frozen > 0);

  // player
  if (live && !S.eaten && !S.inShip && !(S.cine === 'extract' && S.ship && S.ship.beam)) {
    const ax = ctrl ? keys.r - keys.l : 0;
    if (P.dash > 0) { P.dash -= dt; P.vx = P.face * 290; P.vy = 0; if (Math.random() > .3) parts.push({ x: P.x + 5, y: P.y + 4 + Math.random() * 8, vx: -P.face * 20, vy: 0, life: .25, max: .25, c: '#37e0c8', g: 0, s: 2 }); }
    else {
      P.vx += (ax * 108 - P.vx) * Math.min(1, dt * (P.ground ? 16 : 9));
      if (ax) P.face = ax;
      P.vy += 640 * dt; if (!keys.j && P.vy < 0) P.vy += 1000 * dt; P.vy = Math.min(P.vy, 380);
    }
    if (edge.j && ctrl) P.jbuf = .13;
    if (P.jbuf > 0) { P.jbuf -= dt; if (P.coyote > 0) { P.vy = suit ? -335 : -295; P.coyote = 0; P.jbuf = 0; sfx.jump(); burst(P.x + 5, P.y + 14, 5, ['#9fb3bf'], 30, .3, 0); } }
    if (edge.d && ctrl && P.dashCd <= 0) { P.dash = .17; P.dashCd = .6; P.inv = Math.max(P.inv, .22); sfx.dash(); }
    P.dashCd -= dt; P.inv -= dt; P.cool -= dt;

    // fire
    if (edge.f && ctrl && P.cool <= 0) { fire(false); P.cool = .13; }
    if (keys.f && ctrl) P.charge += dt;
    if (edge.fu) { if (P.charge > .45 && ctrl) fire(true); P.charge = 0; }
    if (!keys.f) P.charge = 0;

    // move x
    P.x += P.vx * dt;
    const minX = S.locked ? ARENA + 2 : 0;
    P.x = clamp(P.x, minX, WORLD - P.w);
    if (P.y + P.h > GY + 1) for (const [a, b] of ground) {
      if (P.x + P.w > a && P.x < b) { if (P.x + P.w / 2 < a) P.x = a - P.w; else if (P.x + P.w / 2 > b) P.x = b; }
    }
    // move y
    const prevB = P.y + P.h; P.y += P.vy * dt; P.ground = false;
    if (P.vy >= 0) {
      for (const [a, b] of ground) if (P.x + P.w > a + 1 && P.x < b - 1 && prevB <= GY + .5 && P.y + P.h >= GY) { P.y = GY - P.h; P.vy = 0; P.ground = true; if (P.x > a + 12 && P.x < b - 22) P.check = P.x; }
      for (const p of plats) if (P.x + P.w > p.x + 1 && P.x < p.x + p.w - 1 && prevB <= p.y + .5 && P.y + P.h >= p.y) { P.y = p.y - P.h; P.vy = 0; P.ground = true; }
    }
    if (P.ground) P.coyote = .1; else P.coyote -= dt;
    if (S.lock && S.cine === 'drop' && P.ground) S.lock = 0;
    if (P.shield > 0) P.shield -= dt;
    P.anim += Math.abs(P.vx) * dt;

    if (P.y > H + 8) {
      burst(P.x + 5, H - 4, 18, ['#37e0c8', '#ff4f8b'], 90);
      hurt(15, P.x); if (P.hp > 0) { P.x = P.check; P.y = GY - 40; P.vx = P.vy = 0; P.inv = 1.4; }
    }
    // pools damage contact (shallow surface)
    if (!S.locked && P.x > ARENA - 40) { S.locked = true; spawnBoss(); }
    if (!S.beacon && P.ground && P.x + P.w / 2 > BEACON_X) {
      S.beacon = 1; S.banner = 0; P.hp = maxHp(); P.check = BEACON_X; save = { lv: LV, score: S.score, t: S.t, t0: S.t0 };
      S.anom = 3.4; S.anomMsg = ['LARGE ANOMALY', 'IN THE AREA', 'BEACON SAVED · SUIT RECHARGED', '#ff4f8b'];
      sfx.beacon(); setTimeout(() => sfx.roar(), 500); shake = 4;
      burst(BEACON_X + 2, GY - 37, 34, ['#37e0c8', '#fff', '#c8fff4'], 120, .9, 0);
    }
  }
  edge.j = edge.f = edge.fu = edge.d = 0;

  // camera
  const target = S.locked ? ARENA : clamp(P.x - W * .4 + P.face * 20, 0, ARENA);
  cam += (target - cam) * Math.min(1, dt * 6);
  shake = Math.max(0, shake - dt * 18);

  // bullets
  for (const b of bullets) {
    b.x += b.vx * dt; b.life -= dt;
    if (b.big && Math.random() > .4) parts.push({ x: b.x, y: b.y + (Math.random() - .5) * 6, vx: -b.vx * .05, vy: (Math.random() - .5) * 20, life: .25, max: .25, c: b.frost ? '#bfefff' : '#ffb547', g: 0, s: 1 });
    for (const e of enemies) {
      if (e.hp <= 0 || e.hid || b.hitSet?.has(e)) continue;

        const usedB = Math.min(b.dmg, Math.max(0, B.hp));

        if (b.frost) B.frz = 1.1;
        if (b.big) { (b.hitSet ||= new Set()).add(B); b.dmg -= usedB; if (b.dmg <= 0) b.life = 0; } else b.life = 0;

  for (const e of enemies) {
    if (e.hp <= 0) continue;
    if (P.shield > 0 && live && !e.hid && inShield(e.x, e.y, e.w, e.h)) { e.hp = 0; e.fl = .1; S.score += 50; burst(e.x + e.w / 2, e.y + e.h / 2, 10, ['#ff7a3c', '#ffb547', '#fff'], 90, .4); killEnemy(e); continue; }
    e.fl -= dt;
    if (e.frz > 0) { e.frz -= dt; continue; }
    if (Math.abs(e.x - (cam + W / 2)) > W) continue;
    if (e.t === 'b') {
      const pc = P.x + 5, ex = e.x + 5, dc = LEVELS[LV].th.moss;
      if (e.st === 'hide') {
        e.hid = 1; e.y = GY + 2; e.cd -= dt;
        if (e.cd <= 0 && live && !S.lock && Math.abs(pc - ex) < 104 * .6 / Math.min(1.3, D) + 4 && P.y > GY - 70) { e.st = 'warn'; e.t2 = 0; sfx.dig(); }
      } else if (e.st === 'warn') {
        e.t2 += dt; if (Math.random() > .4) parts.push({ x: ex + (Math.random() - .5) * 12, y: GY - 1, vx: (Math.random() - .5) * 40, vy: -30 - Math.random() * 50, life: .4, max: .4, c: dc[Math.random() > .5 ? 0 : 1], g: 300, s: 1 });
        if (e.t2 > .6 / Math.min(1.3, D)) {
          e.st = 'up'; e.hid = 0; e.y = GY - e.h; e.vy = -340; sfx.jump(); shake = Math.max(shake, 2);
          burst(ex, GY - 2, 14, [dc[0], dc[1], '#ffffff'], 90, .5);
          if (!S.hintB) { S.hintB = 1; S.anom = 2.6; S.anomMsg = ['BURROWER!', '', 'WHEN THE GROUND SHAKES, STOP!', '#ffb547']; }
        }
      } else if (e.st === 'up') {
        e.vy += 640 * dt; e.y += e.vy * dt;
        if (e.vy > 0 && e.y >= GY - e.h) { e.st = 'hide'; e.cd = 1.4; e.hid = 1; e.y = GY + 2; burst(ex, GY - 2, 8, [dc[0], dc[1]], 60, .4); }
      }
    }
    else if (e.t === 'c') { e.x += e.vx * dt * D; if (e.x < e.a || e.x + e.w > e.b) { e.vx *= -1; e.x = clamp(e.x, e.a, e.b - e.w); } }

  // boss

  // embers

    m.x += m.vx * dt; m.y += m.vy * dt; m.vy += 40 * dt; m.life -= dt;
    if (Math.random() > .5) parts.push({ x: m.x, y: m.y, vx: 0, vy: -10, life: .3, max: .3, c: m.j ? (Math.random() > .5 ? '#7af0ff' : '#ff9ae6') : Math.random() > .5 ? '#ff7a3c' : '#ffb547', g: -20, s: 1 });
    if (P.shield > 0 && inShield(m.x - 2, m.y - 2, 4, 4)) { m.life = 0; burst(m.x, m.y, 5, ['#ff7a3c', '#ffb547'], 50, .3); continue; }
    if (live && P.inv <= 0 && Math.abs(m.x - (P.x + 5)) < 6 && Math.abs(m.y - (P.y + 7)) < 8) { hurt(Math.round(10 * D), m.x); m.life = 0; }
    if (m.y > GY && ground.some(([a, b]) => m.x > a && m.x < b)) { m.life = 0; burst(m.x, GY, 5, ['#ff7a3c', '#ffb547'], 50, .3); }
  }
  embers = embers.filter(m => m.life > 0);

  // pickups
  for (const k of picks) {
    k.vy += 300 * dt; k.y += k.vy * dt; k.t += dt;
    if (k.y > GY - 6 && ground.some(([a, b]) => k.x > a && k.x < b)) { k.y = GY - 6; k.vy = 0; }
    if (live && Math.abs(k.x - (P.x + 5)) < 9 && Math.abs(k.y - (P.y + 7)) < 10) { k.dead = 1; P.hp = Math.min(maxHp(), P.hp + 15); S.score += 50; sfx.pick(); if (suit) { P.shield = 1.2; sfx.dash(); } burst(k.x, k.y, 8, ['#37e0c8', '#fff'], 50, .4, 0); }
    if (k.t > 9 || k.y > H) k.dead = 1;
  }
  picks = picks.filter(k => !k.dead);
  if (S.core) {
    const k = S.core; k.t += dt;
    if (k.y < GY - 10 || k.vy < 0) { k.vy += 300 * dt; k.y += k.vy * dt; if (k.y > GY - 10) { k.y = GY - 10; k.vy = 0; } }
    if (live && !S.lock && Math.abs(k.x - (P.x + 5)) < 12 && Math.abs(k.y - (P.y + 7)) < 16) { const kd = S.core.kind; S.core = null; kd === 'frost' ? giveFrost() : giveSuit(); }
  }

  // particles
  for (const p of parts) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy += p.g * dt; p.life -= dt; }
  parts = parts.filter(p => p.life > 0);
  if (parts.length > 600) parts.splice(0, parts.length - 600);
}

function fire(big) {
  const x = P.face > 0 ? P.x + 13 : P.x - 3, y = P.y + 7;
  const fz = big && suit === 2, dm = fz ? 14 : big ? 10 : 1;
  bullets.push({ x, y, vx: P.face * (big ? 240 : 300), r: fz ? 8 : big ? 7 : 2, dmg: dm, dmg0: dm, big, frost: fz, life: big ? 1.4 : .75 });
  if (big) { fz ? sfx.freeze() : sfx.big(); shake = 2.5; P.vx -= P.face * 60; } else sfx.shot();
  burst(x, y, big ? 8 : 3, fz ? ['#7af0ff', '#fff'] : big ? ['#ffb547', '#fff'] : ['#ffe066'], big ? 60 : 30, .15, 0);
}
function killEnemy(e) {
  sfx.kill(); S.score += e.t === 'c' ? 150 : 100;
  burst(e.x + e.w / 2, e.y + e.h / 2, 18, e.t === 'c' ? ['#ff4f8b', '#2c5a3a', '#ffe066'] : ['#b04bff', '#37e0c8'], 100, .6);
  if (Math.random() < Math.min(.7, .45 / diff())) picks.push({ x: e.x + e.w / 2, y: e.y, vy: -90, t: 0 });
}

function updateBoss(dt, live) {
  if (B.gone) return;
  if (B.frz > 0 && B.kind !== 'cat') { B.frz -= dt; B.flash = Math.sin(B.frz * 30) > .6 ? .02 : 0; return; }
  if (B.kind === 'jelly') return updateJelly(dt, live);
  if (B.kind === 'cat') return updateCat(dt, live);
  if (B.kind === 'ant') return updateAntSide(dt, live);
  if (B.kind === 'face') return updateFaceWall(dt, live);
  B.t += dt; B.ph += dt * (B.st === 'dive' ? 14 : 8); B.flash -= dt;
  const enraged = B.hp < B.max * .45, BD = diff();
  const cx = ARENA + W / 2;
  if (B.st === 'intro') {
    B.y += (64 - B.y) * dt * 1.6; B.x += (cx + 60 - B.x) * dt;
    if (B.t > 2) { B.st = 'hover'; B.t = 0; }
  } else if (B.st === 'hover') {
    const tx = cx + Math.sin(B.t * (enraged ? .9 : .6)) * 120, ty = 58 + Math.sin(B.t * 2.1) * 12;
    B.x += (tx - B.x) * dt * 2; B.y += (ty - B.y) * dt * 2;
    B.fireT -= dt;
    if (B.fireT <= 0 && live) {

  }
  // hurt tint + escape flash
  if (P.inv > .7 && S.mode === 'play' && !G.esc) { ctx.fillStyle = `rgba(255,79,139,${(P.inv - .7) * .5})`; ctx.fillRect(-10, -10, W + 20, H + 20); }
  if (G.esc !== 0) { const k = G.esc > 0 ? Math.max(0, 1 - G.esc / .7) : 1; if (k > 0) { ctx.fillStyle = `rgba(255,250,255,${k})`; ctx.fillRect(-10, -10, W + 20, H + 20); } }
}

function hud(time) {
  ctx.font = '8px Silkscreen, monospace'; ctx.textBaseline = 'top';
  // energy
  const ecol = suit === 2 ? '#7af0ff' : suit ? '#ff7a3c' : '#37e0c8';
  ctx.fillStyle = ecol; ctx.fillText(suit === 2 ? 'FROST SUIT' : suit ? 'EMBER SUIT' : 'ENERGY', 8, 6);
  const cells = Math.min(20, Math.ceil(maxHp() / 10)), per = maxHp() / cells, filled = Math.ceil(P.hp / per - .001), low = P.hp <= 25;
  for (let i = 0; i < cells; i++) {
    const on = i < filled;
    ctx.fillStyle = on ? (low && Math.floor(time / 200) % 2 ? '#ff4f8b' : ecol) : (suit === 2 ? 'rgba(122,240,255,.2)' : suit ? 'rgba(255,122,60,.2)' : 'rgba(55,224,200,.18)');
    ctx.fillRect(8 + i * 6, 16, 5, 6);
  }
  ctx.font = '700 8px Silkscreen, monospace'; ctx.fillStyle = '#e6f2ee'; ctx.fillText(String(P.hp).padStart(2, '0'), 12 + cells * 6, 15);
  // score
  ctx.font = '8px Silkscreen, monospace'; ctx.fillStyle = '#ffb547'; ctx.textAlign = 'center';
  ctx.fillText(String(S.score).padStart(6, '0'), W / 2, 6);
  const t = S.t, mm = Math.floor(t / 60), ss = Math.floor(t % 60).toString().padStart(2, '0');
  ctx.fillStyle = 'rgba(230,242,238,.55)'; ctx.fillText(`${mm}:${ss}`, W / 2, 16);
  ctx.textAlign = 'left';
  // minimap strip (sits left of the pause button)
  const mx0 = W - 120, my0 = 7, mw = 72;
  if (!S.gut && !S.shmup) {
  ctx.fillStyle = 'rgba(5,8,13,.6)'; ctx.fillRect(mx0 - 2, my0 - 2, mw + 4, 12);
  for (const [a, b] of ground) { ctx.fillStyle = '#2b5a4a'; ctx.fillRect(mx0 + a / WORLD * mw, my0 + 5, (b - a) / WORLD * mw, 3); }
  ctx.fillStyle = '#ff4f8b'; ctx.fillRect(mx0 + mw - 4, my0 + 1, 3, 3);
  ctx.fillStyle = S.beacon ? '#37e0c8' : '#5b7480'; ctx.fillRect(mx0 + BEACON_X / WORLD * mw - 1, my0 + 1, 2, 3);
  ctx.fillStyle = '#e6f2ee'; ctx.fillRect(mx0 + clamp(P.x / WORLD, 0, 1) * mw - 1, my0, 2, 5);
  }
  // threat meter
  const th = (diff() - .6) / 1, tc = th < .35 ? '#37e0c8' : th < .65 ? '#ffb547' : '#ff4f8b';
  ctx.fillStyle = tc; ctx.fillText('THREAT', mx0 - 2, 20);
  ctx.fillStyle = 'rgba(230,242,238,.15)'; ctx.fillRect(mx0 + 34, 22, 38, 3);
  ctx.fillStyle = tc; ctx.fillRect(mx0 + 34, 22, Math.max(2, 38 * th), 3);
  // boss bar
  if (B && B.st !== 'intro' && !B.gone) {
    const bw = 200, bx = (W - bw) / 2, by = H - 16;
    ctx.fillStyle = 'rgba(5,8,13,.7)'; ctx.fillRect(bx - 2, by - 10, bw + 4, 18);
    ctx.fillStyle = '#ff4f8b'; ctx.textAlign = 'center'; ctx.fillText(B.kind === 'cat' ? `FROST GRUB · ${B.hp}/8 SECTIONS LEFT` : B.kind === 'ant' ? 'BURROW QUEEN' : B.kind === 'face' ? 'THE FACE IN THE WALL' : B.kind === 'jelly' ? 'HOLLOW BLOOM' : 'EMBER MOTH', W / 2, by - 9); ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,79,139,.2)'; ctx.fillRect(bx, by, bw, 4);
    ctx.fillStyle = '#ff7a3c'; ctx.fillRect(bx, by, bw * Math.max(0, B.hp) / B.max, 4);
  }
  if (S.gut && G && G.kind === 'burrow' && G.esc === 0) {
    const A = G.A, bw = 200, bx = (W - bw) / 2, by = H - 16;
    ctx.fillStyle = 'rgba(5,8,13,.7)'; ctx.fillRect(bx - 2, by - 10, bw + 4, 18);
    ctx.textAlign = 'center'; ctx.fillStyle = '#ffb547'; ctx.fillText(`BURROW QUEEN · DEPTH ${Math.floor(12 + G.t * 6)}M`, W / 2, by - 9); ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,181,71,.2)'; ctx.fillRect(bx, by, bw, 4); ctx.fillStyle = '#ff7a3c'; ctx.fillRect(bx, by, bw * Math.max(0, A.hp) / A.max, 4);
  }
  if (S.shmup && SH && !S.gut) {
    ctx.fillStyle = '#9fb5b0'; ctx.fillText('GUN', 8, 26);
    for (let i = 0; i < 3; i++) { ctx.fillStyle = i < SH.wlv ? '#ffe066' : 'rgba(255,224,102,.2)'; ctx.fillRect(30 + i * 6, 27, 5, 5); }
    const bw = 200, bx = (W - bw) / 2, by = H - 16, Bs = SH.boss;
    if (SH.stage === 'fly' || (Bs && Bs.st !== 'boom')) {
      ctx.fillStyle = 'rgba(5,8,13,.7)'; ctx.fillRect(bx - 2, by - 10, bw + 4, 18); ctx.textAlign = 'center';
      if (SH.stage === 'fly') {
        ctx.fillStyle = '#7af0ff'; ctx.fillText('DISTANCE TO THE HIVE LEVIATHAN', W / 2, by - 9);
        ctx.fillStyle = 'rgba(122,240,255,.2)'; ctx.fillRect(bx, by, bw, 4); ctx.fillStyle = '#7af0ff'; ctx.fillRect(bx, by, bw * clamp(SH.dist / SLEN, 0, 1), 4);
        ctx.fillStyle = '#ffb547'; ctx.fillRect(bx + bw * CHK / SLEN - 1, by - 1, 2, 6);
      } else {
        const tot = Bs.sacs.reduce((a, q) => a + Math.max(0, q.hp), 0), mx = Bs.sacs.reduce((a, q) => a + q.max, 0);
        ctx.fillStyle = '#ff4f8b'; ctx.fillText(tot > 0 ? `HIVE LEVIATHAN · ${Bs.sacs.filter(q => q.hp > 0).length} SPORE SACS LEFT` : 'HIVE LEVIATHAN', W / 2, by - 9);
        ctx.fillStyle = 'rgba(255,79,139,.2)'; ctx.fillRect(bx, by, bw, 4); ctx.fillStyle = '#ff7a3c'; ctx.fillRect(bx, by, bw * tot / mx, 4);
      }
      ctx.textAlign = 'left';
    }
    if (Bs && Bs.st === 'enter') {
      ctx.textAlign = 'center'; ctx.globalAlpha = Math.floor(time / 150) % 2 ? 1 : .5;
      ctx.fillStyle = '#ff4f8b'; ctx.font = '700 16px Silkscreen, monospace'; ctx.fillText('WARNING', W / 2, 120);
      ctx.font = '8px Silkscreen, monospace'; ctx.fillStyle = '#ffb547'; ctx.fillText('COLOSSAL BIO-SHIP INBOUND', W / 2, 140);
      ctx.textAlign = 'left'; ctx.globalAlpha = 1;
    }
  }
  if (S.gut && G && G.kind === 'hive' && G.esc === 0) {
    const bw = 200, bx = (W - bw) / 2, by = H - 16, k = clamp(G.prog / G.need, 0, 1);
    ctx.fillStyle = 'rgba(5,8,13,.75)'; ctx.fillRect(bx - 2, by - 10, bw + 4, 18);
    ctx.textAlign = 'center'; ctx.fillStyle = '#ffb547'; ctx.fillText(`HULL BREACH ${Math.floor(k * 100)}% · SHOOT ANYWHERE`, W / 2, by - 9); ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(255,181,71,.2)'; ctx.fillRect(bx, by, bw, 4); ctx.fillStyle = '#ffb547'; ctx.fillRect(bx, by, bw * k, 4);
  }
  if (S.gut && G && G.kind !== 'burrow' && G.kind !== 'hive' && G.kind !== 'ar' && G.esc === 0) {
    const bw = 200, bx = (W - bw) / 2, by = H - 16, cut = G.phase === 'cut', sl = G.kind === 'slice';
    const sst = sl && Object.values(G.segState).find(x => !x.failed);
    const k = sl ? (G.done ? 1 : sst ? (2 - sst.left) / 2 : 0) : cut ? 1 - G.holeHp / G.holeMax : G.kills / G.need, col = cut ? '#37e0c8' : '#7af0ff';
    ctx.fillStyle = 'rgba(5,8,13,.7)'; ctx.fillRect(bx - 2, by - 10, bw + 4, 18);
    ctx.textAlign = 'center'; ctx.fillStyle = col;
    ctx.fillText(sl ? (sst ? 'SHOOT BOTH HALVES' : 'SLICE THE SECTION') : cut ? 'CUTTING THROUGH THE BLOOM' : `BLOBS DESTROYED ${G.kills}/${G.need}`, W / 2, by - 9); ctx.textAlign = 'left';
    ctx.fillStyle = 'rgba(122,240,255,.2)'; ctx.fillRect(bx, by, bw, 4);
    ctx.fillStyle = col; ctx.fillRect(bx, by, bw * k, 4);
  }
  // banners
  if (S.banner > 0 && S.mode === 'play') {
    ctx.globalAlpha = Math.min(1, S.banner); ctx.textAlign = 'center';
    ctx.fillStyle = '#e6f2ee'; ctx.font = '700 16px Silkscreen, monospace'; ctx.fillText(LEVELS[LV].banner[0], W / 2, 78);
    ctx.font = '8px Silkscreen, monospace'; ctx.fillStyle = '#37e0c8'; ctx.fillText(LEVELS[LV].banner[1], W / 2, 98);
    ctx.textAlign = 'left'; ctx.globalAlpha = 1;
  }
  if (S.anom > 0 && S.anomMsg && S.mode === 'play') {
    const [a, b, sub, col] = S.anomMsg;
    ctx.textAlign = 'center'; ctx.globalAlpha = Math.min(1, S.anom) * (col === '#ff4f8b' && Math.floor(time / 150) % 2 ? .55 : 1);
    ctx.fillStyle = col; ctx.font = '700 16px Silkscreen, monospace'; ctx.fillText(a, W / 2, 62); ctx.fillText(b, W / 2, 80);
    ctx.globalAlpha = Math.min(1, S.anom); ctx.font = '8px Silkscreen, monospace'; ctx.fillStyle = '#37e0c8'; ctx.fillText(sub, W / 2, 102);
    ctx.textAlign = 'left'; ctx.globalAlpha = 1;
  }
  if (B && B.st === 'intro') {
    ctx.textAlign = 'center'; ctx.globalAlpha = Math.floor(time / 150) % 2 ? 1 : .5;
    ctx.fillStyle = '#ff4f8b'; ctx.font = '700 16px Silkscreen, monospace'; ctx.fillText('WARNING', W / 2, 120);
    ctx.font = '8px Silkscreen, monospace'; ctx.fillStyle = '#ffb547'; ctx.fillText({ jelly: 'MASSIVE BIOSIGNAL INBOUND', cat: 'SOMETHING IS BURROWING THROUGH THE ICE', ant: 'SEISMIC ACTIVITY · SOMETHING HUGE', face: 'SOMETHING IN THE WALL IS AWAKE', moth: 'LARGE LIFEFORM ABOVE' }[B.kind], W / 2, 140);
    ctx.textAlign = 'left'; ctx.globalAlpha = 1;
  }
}

/* ---------- loop ---------- */
let last = performance.now(), acc = 0;
const STEP = 1 / 120;
function loop(now) {
  let dt = Math.min(.05, (now - last) / 1000); last = now;
  if (S.mode !== 'paused' && S.mode !== 'title') {
    acc += dt;
    while (acc >= STEP) { update(STEP); acc -= STEP; }
  } else if (S.mode === 'title') { cam = (Math.sin(now / 6000) * .5 + .5) * 600; }
  draw(now);
  requestAnimationFrame(loop);
}
document.addEventListener('visibilitychange', () => { if (document.hidden && S.mode === 'play') pause(); });
titleScreen();
requestAnimationFrame(loop);
})();
</script>
